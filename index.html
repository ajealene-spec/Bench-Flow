<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006747" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bench Flow" />
    <meta name="description" content="Bench Flow: the open lab notebook for every bench. Free, offline-first, built for reproducible neuroscience." />
    <title>Bench Flow</title>
    <script>
      /* Apply the saved theme before first paint. Keep the key in sync with THEME_STORAGE_KEY in src/app/appearance.ts. */
      (function () {
        try {
          var t = localStorage.getItem("lab-companion-theme");
          var dark = t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
